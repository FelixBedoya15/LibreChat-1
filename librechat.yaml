# Web Search Configuration (SearXNG + Self-Hosted OpenSource BGE Reranker)
webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  rerankerType: "jina"
  jinaApiUrl: "${RERANKER_API_URL}"
  jinaApiKey: "${JINA_API_KEY}"


# Memory configuration for user memories
memory:
  # (optional) Disable memory functionality
  disabled: false
  # (optional) Restrict memory keys to specific values to limit memory storage and improve consistency
  # validKeys: ["preferences", "work_info", "personal_info", "skills", "interests", "context"]
  # (optional) Maximum token limit for memory storage
  tokenLimit: 30000
  # (optional) Enable personalization features (defaults to true if memory is configured)
  personalize: true
  # Memory agent configuration - using Google Gemini inline (no separate agent needed)
  agent:
    provider: "google"
    model: "gemini-3.5-flash-lite"
    model_parameters:
      temperature: 0.1

# Habilitar soporte de Model Context Protocol (MCP)
mcpServers:
  notebooklm:
    type: "streamable-http"
    url: "http://notebooklm-mcp:9420/mcp"
    timeout: 120000
    serverInstructions: true
    headers:
      x-user-id: "{{LIBRECHAT_USER_ID}}"
      x-user-email: "{{LIBRECHAT_USER_EMAIL}}"
      x-notebooklm-auth: "{{USER_NOTEBOOKLM_SESSION}}"
    customUserVars:
      USER_NOTEBOOKLM_SESSION:
        title: "Sesión Privada de NotebookLM (Opcional)"
        description: "Pega tus cookies de Google si deseas usar tu cuenta privada en lugar de la compartida de WAPPY."
        sensitive: true

