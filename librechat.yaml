      Reproduction, distribution, or modification of the software without express written authorization from WAPPY LTDA is strictly prohibited.

      ## 2. User Data

      We collect personal data, such as your name, email address, and access information, as described in our Privacy Policy. 
      This information is collected solely to provide and improve our services, process transactions, and communicate with you.

      ## 3. Platform Usage

      You agree to use the platform only for lawful purposes and in a manner that does not infringe upon the rights of third parties. The following actions are expressly prohibited:
